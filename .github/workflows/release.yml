name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'
          check-latest: true

      - name: Install smartcard library
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: Run tests
        run: go test -race -tags piv ./...

      - name: Run vet
        run: go vet ./...

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'
          check-latest: true

      - name: Install smartcard library
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: Build binary
        run: go build -tags piv -o tufcli .

      - name: Trigger Go module proxy indexing
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          MODULE=$(head -1 go.mod | awk '{print $2}')
          echo "Triggering proxy indexing for module ${MODULE} at ${TAG}"
          HTTP_CODE=$(curl -s -o /tmp/proxy-response -w "%{http_code}" \
            "https://proxy.golang.org/${MODULE}/@v/${TAG}.info")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Proxy indexing succeeded (HTTP ${HTTP_CODE})"
            cat /tmp/proxy-response
          else
            echo "::warning::Proxy indexing returned HTTP ${HTTP_CODE} — module may not be indexed yet"
            cat /tmp/proxy-response
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
